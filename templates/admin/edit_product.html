<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | RentWear</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .form-container {
            max-width: 700px;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #762F3B;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #762F3B;
            color: white;
            padding: 13px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="/" class="logo">RentWear</a>
    <div>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/products">Products</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="form-container">

    <h1>Edit Outfit</h1>

    <form method="POST">

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="product_name"
                   value="{{ product.product_name }}" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category_id" required>
                {% for category in categories %}
                <option value="{{ category.category_id }}"
                    {% if category.category_id == product.category_id %}selected{% endif %}>
                    {{ category.category_name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" required>{{ product.description }}</textarea>
        </div>

        <div class="form-group">
            <label>Size</label>
            <input type="text" name="size" value="{{ product.size }}" required>
        </div>

        <div class="form-group">
            <label>Colour</label>
            <input type="text" name="color" value="{{ product.color }}" required>
        </div>

        <div class="form-group">
            <label>Rental Price Per Day (₹)</label>
            <input type="number" name="rental_price"
                   value="{{ product.rental_price }}" min="1" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Security Deposit (₹)</label>
            <input type="number" name="security_deposit"
                   value="{{ product.security_deposit }}" min="0" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Image Path</label>
            <input type="text" name="image_url"
                   value="{{ product.image_url }}" required>
        </div>

        <div class="form-group">
            <label>Availability</label>
            <select name="availability_status">
                <option value="available"
                    {% if product.availability_status == 'available' %}selected{% endif %}>
                    Available
                </option>
                <option value="unavailable"
                    {% if product.availability_status == 'unavailable' %}selected{% endif %}>
                    Unavailable
                </option>
            </select>
        </div>

        <button type="submit">Save Changes</button>

    </form>

</div>

</body>
</html>
