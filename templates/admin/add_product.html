<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product | RentWear</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .form-container {
            max-width: 700px;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .form-container h1 {
            color: #762F3B;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .submit-btn {
            background: #762F3B;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="/" class="logo">RentWear</a>
    <div>
        <a href="/admin/dashboard">Dashboard</a>
        <a href="/admin/products">Products</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<div class="form-container">

    <h1>Add New Outfit</h1>

    <form method="POST">

        <div class="form-group">
            <label>Product Name</label>
            <input type="text" name="product_name" required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <select name="category_id" required>
                <option value="">Select Category</option>
                {% for category in categories %}
                    <option value="{{ category.category_id }}">
                        {{ category.category_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Description</label>
            <textarea name="description" rows="3" required></textarea>
        </div>

        <div class="form-group">
            <label>Size</label>
            <input type="text" name="size" placeholder="S, M, L, XL or Free" required>
        </div>

        <div class="form-group">
            <label>Colour</label>
            <input type="text" name="color" required>
        </div>

        <div class="form-group">
            <label>Rental Price Per Day (₹)</label>
            <input type="number" name="rental_price" min="1" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Security Deposit (₹)</label>
            <input type="number" name="security_deposit" min="0" step="0.01" value="0" required>
        </div>

        <div class="form-group">
            <label>Image Path</label>
            <input type="text" name="image_url" placeholder="images/lehenga.jpg" required>
        </div>

        <div class="form-group">
            <label>Availability</label>
            <select name="availability_status">
                <option value="available">Available</option>
                <option value="unavailable">Unavailable</option>
            </select>
        </div>

        <button type="submit" class="submit-btn">
            Add Product
        </button>

    </form>

</div>

</body>
</html>
