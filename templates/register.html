<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | RentWear</title>
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<section style="max-width:450px; margin:70px auto; padding:35px;
background:white; border-radius:12px;">

    <h1 style="color:#762F3B;">Join RentWear</h1>

    <p>Create your account and discover your style.</p>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input type="text" name="full_name"
        placeholder="Full Name" required>

        <input type="email" name="email"
        placeholder="Email Address" required>

        <input type="tel" name="phone"
        placeholder="Phone Number" required>

        <input type="password" name="password"
        placeholder="Create Password" required minlength="6">

        <button type="submit" class="main-btn"
        style="width:100%; margin-top:20px;">
            Create Account
        </button>

    </form>

    <p style="margin-top:20px;">
        Already registered?
        <a href="/login">Login</a>
    </p>

</section>

</body>
</html>
